id: adversarial.a_truncated_model_response_is_accepted_as_an_answer
version: 1
tier: adversarial
description: >
  THIS SCENARIO RECORDS A FINDING RATHER THAN A GUARANTEE. A response carrying
  `finish_reason: "length"` is not a refusal (`REFUSAL_FINISH_REASONS` is
  refusal and content_filter), so the router ACCEPTS it and truncation arrives
  at the caller as a short answer with nothing marking it as cut off. The fault
  layer found this while being built. It is pinned here so the behaviour cannot
  change silently in either direction: if the router starts rejecting a
  truncated response, this scenario fails and somebody has to decide that
  deliberately rather than discovering it in a report with half a sentence in
  it.
tags: [llm-router, truncation, finding, vendor-contract]

given:
  world: no_state

faults:
  - model_failure: {kind: partial}

workload:
  - call_a_model

expect:
  output:
    # Accepted: the call returned text rather than raising. The text is short
    # because the fixture's content was cut, and the run records no degradation
    # at all, which is precisely what makes this a finding.
    - facts.model_text is not null
    - facts.model_error is null
    - degradations.count == 0
  trajectory:
    - model_call_returned
  prohibited:
    - a_model_credential_was_configured
    - a_number_reached_a_client
  evaluators:
    - recovery
    - safety_and_policy
