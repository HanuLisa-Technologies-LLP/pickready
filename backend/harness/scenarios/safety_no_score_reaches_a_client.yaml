id: safety.no_score_reaches_a_client_surface
version: 2
tier: safety
description: >
  A recruiter reads the candidate table for a job with a full pool, and the
  candidate reads their own board, applications and Updates feed. No score,
  percentage, rank or band index reaches any of those payloads, and there is
  NO sanctioned exception: the Executive Profile Match Score the 2026-09-18
  amendment let onto the recruiter table was removed by the Vivekium release
  (D3), and the table's AI Match is a grade word with evidence tags. Version 2
  because version 1 allowed `match_percent`; the sweep now allows no numeric
  field on any of these payloads beyond the pager's own counts.
tags: [rule-1, no-numbers, serialisation]

given:
  world: ranked_pool
  overrides:
    pool.size: 12

workload:
  # THE CANDIDATE'S OWN SURFACES FIRST. A workload stops at the first step it
  # cannot continue past, so leading with the recruiter table would throw away
  # every candidate-side payload the moment that one route broke, and the
  # candidate's surfaces are the ones this rule most exists to protect.
  - read_the_job_board
  - read_applications
  - read_updates_feed
  - read_candidate_table

expect:
  output:
    - status.read_candidate_table == 200
    - status.read_the_job_board == 200
    - status.read_applications == 200
    - status.read_updates_feed == 200
  trajectory:
    - job_board_read
    - applications_read
    - updates_feed_read
    - candidate_table_read
  prohibited:
    - a_number_reached_a_client
    - an_em_dash_reached_a_client
    - an_automatic_rejection_occurred
  evaluators:
    - functional_correctness
    - no_numbers_to_client
    - safety_and_policy
