id: regression.an_emptied_matrix_is_not_an_ungenerated_one
version: 1
tier: regression
description: >
  A reviewer who deliberately clears every item is told the blocker they can
  clear, and Sutra is NOT re-enqueued. `_framework_repair_pending` asked
  `load_framework`, which filters `is_active`, so an emptied matrix and one the
  generator never wrote both answered zero rows: the reviewer was told "We are
  still preparing the evaluation criteria for this role" and the compile was
  queued again, which would have put the items they had just deleted back. One
  row of ANY kind is proof the generator landed.
tags: [matrix, soft-delete, repair, "2026-09-21"]

given:
  world: job_with_generated_matrix

workload:
  - empty_the_matrix
  - read_framework

expect:
  state:
    - job_competencies.active_count == 0
    - job_competencies.total_count == 8
  dispatched:
    # THE HALF THAT MATTERS MOST. The repair path's damage was not the wrong
    # sentence, it was re-enqueueing the generator over a matrix a person had
    # just emptied on purpose. An exact zero, because "at least once" is the
    # property a dispatcher gives for free.
    pickready.compile_tatva_matrix: 0
  output:
    - status.read_framework == 200
    - facts.framework_says_still_preparing == false
    - facts.framework_item_count == 0
    # The reviewer is told the blocker they can actually clear, so the sentence
    # has to be present as well as not be the wrong one. An empty
    # `blocking_reason` here would mean the screen offered them a Save control
    # over a matrix that cannot be saved.
    - facts.framework_blocking_reason is not null
    - facts.framework_blocking_reason != ""
  trajectory:
    - matrix_emptied
    - framework_read
  prohibited:
    - a_number_reached_a_client
    - an_em_dash_reached_a_client
  evaluators:
    - functional_correctness
    - state_correctness
    - safety_and_policy
    - no_numbers_to_client
