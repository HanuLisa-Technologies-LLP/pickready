id: regression.a_credential_failure_trips_the_breaker_at_once
version: 1
tier: regression
description: >
  A 401 from the model vendor opens the circuit breaker on its FIRST
  occurrence, so the caller's deterministic fallback starts one attempt sooner
  rather than three. No amount of waiting fixes a revoked key, which is what
  makes this different from a 429 or a 5xx. The fault serves the authored
  `openai/error_401_authentication.json` envelope to the router's own client,
  so what is observed is the real `classify_failure` and the real breaker
  rather than a patched function returning a canned answer.
tags: [llm-router, circuit-breaker, credential, resilience]

given:
  world: no_state

faults:
  - model_failure: {kind: credential}

workload:
  - call_a_model_twice

expect:
  output:
    - facts.breaker_open_after_one_failure == true
    - facts.breaker_failure_counts == [1]
    # The first call is refused for the credential; the second never reaches
    # the vendor at all. Two different sentences, and the difference between
    # them is the whole behaviour: a breaker that reported the same message
    # twice would be indistinguishable from one that had not opened.
    - facts.first_model_error contains credential
    - facts.second_model_error contains "cooling down"
    - degradations.count == 2
    - degradations.kinds == [model_unavailable]
  trajectory:
    - model_call_refused
    - breaker_state_read
  prohibited:
    # Silent survival is a finding, not a pass (HARNESS.md section 4).
    - a_fault_went_unrecorded
    # Asserted in the judging phase, AFTER the fault has unwound, which is
    # what proves the credential the fault supplied to reach the transport was
    # removed again rather than left behind for the next scenario.
    - a_model_credential_was_configured
  evaluators:
    - degradation_honesty
    - recovery
    - safety_and_policy
    - functional_correctness
