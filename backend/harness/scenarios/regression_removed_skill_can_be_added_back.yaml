id: regression.a_removed_skill_can_be_added_back
version: 1
tier: regression
description: >
  A reviewer clears the generated matrix and pastes their own list, two of
  whose names they had just removed. The removed rows are REVIVED rather than
  re-inserted, the names already present are returned untouched rather than
  refused, and nothing answers 500. Measured in pilot on 2026-09-20: deletion
  is soft because a generated question may reference the row, while
  `uq_job_competency_name` is on (job_id, category, name) with NO predicate, so
  a removed name still held its slot invisibly and the paste raised
  UniqueViolationError twice, forty-five seconds apart, behind the words "API
  error 500".
tags: [matrix, soft-delete, unique-constraint, "2026-09-20"]

given:
  world: job_with_generated_matrix

workload:
  - empty_the_matrix
  - paste_the_same_names_back

expect:
  state:
    # REVIVED, NOT RE-INSERTED, and this pair of counts is what says so. Ten
    # rows were seeded across the three aspects and eight of them were emptied
    # here; the paste brings back Python and PostgreSQL and adds three names
    # nobody has used, so the table grows by exactly three. A re-insert would
    # have taken the total to thirteen, and a refusal would have left it at
    # ten.
    - job_competencies.total_count == 11
    - job_competencies.active_count == 5
    - job_competencies.active_names == [Agentic AI, DSA, LLMs, PostgreSQL, Python]
  output:
    # NOT 500, and not 409 either. A paste where two of five names are already
    # present must not discard the other three, so the whole requested set is
    # in the response.
    - status.paste_the_same_names_back == 201
    - statuses.empty_the_matrix == [204, 204, 204, 204, 204, 204, 204, 204]
  trajectory:
    - matrix_emptied
    - names_pasted_back
  prohibited:
    - a_number_reached_a_client
    - an_em_dash_reached_a_client
  evaluators:
    - functional_correctness
    - state_correctness
    - safety_and_policy
    - no_numbers_to_client
