# Strict typing scope (spec-doc6 §10.3).
#
#   "mypy --strict (or equivalent) clean on app/hiring/, app/miti/, app/siddhi/,
#    and every module touched in this phase. Report the coverage percentage of
#    strictly-typed modules."
#
# This file exists so that `python -m mypy` with no arguments checks exactly the
# scope the spec requires, rather than a path list a reader has to reconstruct
# from a CI step. The CI job runs the bare command.
#
# NOTE ON THE PATHS: spec-doc6 §2.2 writes the hiring packages as `app/hiring/`,
# `app/miti/` and `app/siddhi/`. This repository's layout puts all three under
# `app/services/`, which CLAUDE.md already records. Same modules, one directory
# deeper.
#
# NO PER-FILE IGNORES. spec-doc6 §10.3: "no per-file ignores added during this
# phase". There is deliberately no `[mypy-app.*]` section below relaxing
# anything, and adding one to get this file green would be defeating the check
# rather than passing it. An error that cannot be fixed in the file that owns it
# is a finding, and belongs in the phase report.
#
# `follow_imports = silent` is not a relaxation of the checked scope: it type
# checks the listed files fully and declines to REPORT errors in the modules
# they import, which would otherwise mean strict-mode findings for every
# SQLAlchemy model and FastAPI router the hiring layer touches. Those modules
# are framework-shaped and are not in this phase's scope; pulling their errors
# in here would bury the ones that are.

[mypy]
python_version = 3.12
strict = True
follow_imports = silent
show_error_codes = True
pretty = False

files =
    app/config/llm_providers.py,
    app/services/embeddings.py,
    app/services/llm_router.py,
    app/services/reliability,
    app/services/hiring,
    app/services/miti,
    app/services/siddhi,
    app/services/rbac.py,
    app/services/capabilities.py,
    app/services/role_hierarchy.py,
    scripts/verify_live.py,
    scripts/check-coverage-floors.py,
    scripts/check-dead-code.py,
    scripts/check-import-cycles.py

# PyYAML ships no py.typed, so --strict reports missing stubs without
# `types-PyYAML`. It is pinned explicitly in requirements.txt for the same
# reason PyYAML itself is: the hiring layer fails at import without it, and a
# transitive dependency a vendor drops in a minor release is an outage nobody
# predicted.
