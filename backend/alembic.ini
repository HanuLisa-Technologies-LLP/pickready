# Alembic configuration for PickReady (backend).
# The database URL is injected at runtime from app.core.config (env var
# DATABASE_URL) in alembic/env.py — the empty value below is intentional.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Timezone-naive version file names, ordered
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
