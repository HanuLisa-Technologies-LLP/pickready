# Extracted from the Ready Pick Now Hiring Philosophy & Intelligence
# Runbook, document RPN-PHIL-001, version 1.1.
#
# THIS FILE IS NOT AN INDEPENDENT SOURCE OF TRUTH. Every entry carries a
# `source` naming the Runbook section it was taken from, and
# backend/tests/test_runbook_parity.py fails if this file and the Runbook
# disagree in either direction. Change the Runbook and this file in the
# same commit, or the build stops.
#
# Generated once from the Runbook tables and maintained by hand thereafter.

meta:
  document: RPN-PHIL-001
  runbook_version: "1.2"
  description: "Department competency models (Part VI) and the Layer 1 baseline weight matrix they select a family from."

reading_rule:
  source: "RPN-PHIL-001 Part VI"
  menu_rule: "the competency list in each model is the menu. The scorecard for a given role selects at most six from it, weighted by SWOT force-ranking. No role uses the whole menu."
  claimed_structure: "Every model follows the same eleven-section structure so that they are comparable and so that adding a new department is a filling-in exercise rather than an invention."
  runbook_ambiguity: "The claimed eleven-section structure is not what the document delivers: subsection counts run from four (§33, §35) to twelve (§21), and §67.8 separately concedes that department coverage is uneven. See RUNBOOK_OPEN_QUESTIONS.md Q4."

