  statement: "Baselines are Ready Pick Now's professional judgement, expressed as calibration hypotheses (Axiom 13). They are revised only on calibration evidence."

departments:
  it_software_engineering:
    source: "RPN-PHIL-001 §21"
    number: 21
    title: "IT & SOFTWARE ENGINEERING"
    baseline_weight_family: it_software
    role_families:
      - "Backend"
      - "Frontend"
      - "Full-stack"
      - "Mobile"
      - "Platform/Infrastructure/SRE/DevOps"
      - "Data engineering"
      - "QA/SDET"
      - "Security"
      - "Embedded"
      - "Engineering management"
    competency_menu_source: "RPN-PHIL-001 §21.3"
    competency_menu:
      - id: "SW-01"
        competency: "Core language & runtime depth"
        observable_evidence: "Can reason about memory, concurrency, error semantics of their primary stack; explains behaviour, not just syntax"
      - id: "SW-02"
        competency: "System design & architecture"
        observable_evidence: "Designs to constraints; states trade-offs; identifies failure modes and their blast radius"
      - id: "SW-03"
        competency: "Debugging & problem diagnosis"
        observable_evidence: "Reconstructs a real diagnosis path; forms and tests hypotheses rather than guessing"
      - id: "SW-04"
        competency: "Production ownership"
        observable_evidence: "Has been accountable for a live service: on-call, incidents, rollbacks, postmortems"
      - id: "SW-05"
        competency: "Data modelling & storage"
        observable_evidence: "Chooses stores to fit access patterns; explains consistency and migration implications"
      - id: "SW-06"
        competency: "Code quality & maintainability"
        observable_evidence: "Reviews meaningfully; refactors deliberately; writes tests as a matter of course"
      - id: "SW-07"
        competency: "Delivery under constraint"
        observable_evidence: "Ships within real deadlines with explicit, defended scope trade-offs"
      - id: "SW-08"
        competency: "Collaboration & technical influence"
        observable_evidence: "Drives decisions across teams; changes minds with reasoning; documents"
      - id: "SW-09"
        competency: "AI-tool fluency"
        observable_evidence: "Uses AI tooling to increase leverage while retaining verification, review and understanding - and can say where they don't trust it"
      - id: "SW-10"
        competency: "Security & correctness awareness"
        observable_evidence: "Anticipates misuse, injection, authz failure, data exposure"
      - id: "SW-11"
        competency: "Domain/product judgement"
        observable_evidence: "Understands who uses the system and makes engineering choices accordingly"
      - id: "SW-12"
        competency: "Engineering leadership (EM roles)"
        observable_evidence: "Grows engineers; sets technical direction; owns delivery of a group"
    seniority_notes_source: "RPN-PHIL-001 §21.11"
    seniority_notes:
      - level: "Fresher"
        emphasis_shift: "Reasoning, learning velocity, depth on one thing"
      - level: "2–5"
        emphasis_shift: "Independent delivery; debugging; code quality"
      - level: "5–10"
        emphasis_shift: "System design; production ownership; influence"
      - level: "10+"
        emphasis_shift: "Architecture at organisational scale; trade-off judgement; mentoring"
      - level: "EM"
        emphasis_shift: "Delivery of a group; growing engineers; technical direction; D1 shifts from personal coding to technical judgement"
    subsections_present: 12
    probe_design_pairs_source: "RPN-PHIL-001 §21.6"
    probe_design_pairs:
      - claim_type: "Scale"
        weak_probe: "\"What is horizontal scaling?\""
        strong_probe: "\"At what point did your system first fall over, what was the symptom, and what did you change first?\""
      - claim_type: "Ownership"
        weak_probe: "\"Did you lead the migration?\""
        strong_probe: "\"Who else could have done your part, and what would have been different if they had?\""
      - claim_type: "Architecture"
        weak_probe: "\"Explain microservices.\""
        strong_probe: "\"What did you split first, and what did you deliberately leave in the monolith - and why that boundary?\""
      - claim_type: "Debugging"
        weak_probe: "\"How do you debug?\""
        strong_probe: "\"Describe a bug that took more than two days. What was your first wrong hypothesis?\""
      - claim_type: "Impact"
        weak_probe: "\"What was the improvement?\""
        strong_probe: "\"How was the baseline measured, and what else changed during that period?\""
      - claim_type: "AI use"
        weak_probe: "\"Do you use AI tools?\""
        strong_probe: "\"Describe a case where the model's suggestion was confidently wrong and how you caught it.\""
    gaming_vectors_source: "RPN-PHIL-001 §21.7"
    gaming_vectors:
      - vector: "AI-written resume with perfect keyword alignment"
        countermeasure: "Demote resume to E0/E1; weight walkthrough"
      - vector: "AI-generated portfolio projects"
        countermeasure: "Probe design decisions and failure modes; check repository history depth"
      - vector: "AI-solved take-home"
        countermeasure: "Permit AI explicitly; score the walkthrough"
      - vector: "Live coding with off-screen assistance"
        countermeasure: "Require reasoning aloud; ask unpredictable follow-ups on their own code; interrupt with a constraint change"
      - vector: "Fabricated repository ownership"
        countermeasure: "Signed-commit check; contribution graph; ask about a specific commit they made"
      - vector: "Deepfake / proxy interviewing"
        countermeasure: "Live synchronous stage mandatory at senior level; identity continuity checks across stages; unpredictable topic shifts"
      - vector: "Inflated title/scope"
        countermeasure: "Reference corroboration on scope; blast-radius questions"
      - vector: "Memorised system-design answers"
        countermeasure: "Use the client's actual constraints from the SWOT; canned answers fail immediately"
    red_flags_source: "RPN-PHIL-001 §21.8"
    red_flags:
      - "Cannot explain a decision in a system they claim to have architected"
      - "All repository activity created within weeks of applying, presented as multi-year work"
      - "Fluent vocabulary with no operational specifics (\"we used Kafka for event-driven architecture\" with no partitioning, ordering or failure discussion)"
      - "Claims production ownership but cannot describe a single incident"
      - "Assessment performance dramatically inconsistent with claimed seniority in either direction"
      - "Reference cannot confirm the scope the candidate claims"
  data_analytics_data_science_ai_ml:
    source: "RPN-PHIL-001 §22"
    number: 22
    title: "DATA, ANALYTICS, DATA SCIENCE & AI/ML"
    baseline_weight_family: data_and_rnd
    role_families:
      - "Data analyst"
      - "BI"
      - "Analytics engineer"
      - "Data engineer"
      - "Data scientist"
      - "ML engineer"
      - "Applied research"
    competency_menu_source: "RPN-PHIL-001 §22.3"
    competency_menu:
      - id: "DA-01"
        competency: "Problem framing"
        observable_evidence: "Converts a vague business question into a measurable one with a defined decision it will inform"
      - id: "DA-02"
        competency: "Data quality interrogation"
        observable_evidence: "Checks provenance, completeness, bias, collection mechanism before analysing"
      - id: "DA-03"
        competency: "Statistical judgement"
        observable_evidence: "Knows when a method is invalid; recognises leakage, confounding, multiple comparisons, survivorship"
      - id: "DA-04"
        competency: "SQL & data manipulation"
        observable_evidence: "Writes correct, efficient queries against messy real schemas"
      - id: "DA-05"
        competency: "Modelling craft"
        observable_evidence: "Chooses methods appropriate to data and decision; validates honestly; avoids over-engineering"
      - id: "DA-06"
        competency: "Pipeline & production engineering"
        observable_evidence: "Builds reliable, monitored, reproducible pipelines"
      - id: "DA-07"
        competency: "Communication & influence"
        observable_evidence: "Explains findings to non-technical decision-makers; states uncertainty without hedging into uselessness"
      - id: "DA-08"
        competency: "Business impact"
        observable_evidence: "Analysis changed a decision, and the decision changed an outcome"
      - id: "DA-09"
        competency: "Experimentation"
        observable_evidence: "Designs valid experiments; understands power, novelty effects, interference"
      - id: "DA-10"
        competency: "ML systems operation"
        observable_evidence: "Monitors drift, retrains, handles feedback loops and degradation"
    seniority_notes: null
    subsections_present: 10
    validation_probes_source: "RPN-PHIL-001 §22.6"
    validation_probes:
      - "\"What did you check about the data before you trusted it?\""
      - "\"What would have made you abandon this approach?\""
      - "\"Who acted on this analysis, and what did they do differently?\""
      - "\"What's the simplest thing that would have worked, and why didn't you do that?\""
      - "\"Where could this result be wrong, and how badly?\""
      - "For ML: \"How did it degrade in production, and how did you find out?\""
    gaming_vectors_source: "RPN-PHIL-001 §22.7"
    gaming_vectors:
      - vector: "Kaggle/portfolio notebooks generated or copied"
        countermeasure: "Probe assumptions and alternatives; require live critique"
      - vector: "Vocabulary fluency without judgement"
        countermeasure: "Flawed-analysis critique; ask what they checked, not what they used"
      - vector: "Claiming model ownership on a team project"
        countermeasure: "Attribution probe; reference; ask what they specifically decided"
      - vector: "Overstated impact numbers"
        countermeasure: "Ask for the decision the analysis changed and who made it"
      - vector: "AI-generated take-home"
        countermeasure: "Permit AI, require walkthrough, probe the assumptions the model made silently"
    red_flags_source: "RPN-PHIL-001 §22.8"
    red_flags:
      - "Cannot name a single thing that could invalidate their own result"
      - "presents accuracy without a baseline"
      - "no awareness of how data was collected"
      - "describes production ML with no mention of monitoring or drift"
      - "impact claims with no decision attached"
  mechanical_engineering_manufacturing:
    source: "RPN-PHIL-001 §23"
    number: 23
    title: "MECHANICAL ENGINEERING & MANUFACTURING"
    baseline_weight_family: engineering_physical
    role_families:
      - "Design engineer"
      - "Manufacturing/production engineer"
      - "Quality engineer"
      - "Maintenance"
      - "Tooling"
      - "NPD"
      - "HVAC"
      - "Automotive"
      - "Plant engineering"
    competency_menu_source: "RPN-PHIL-001 §23.3"
    competency_menu:
      - id: "ME-01"
        competency: "Engineering fundamentals applied"
        observable_evidence: "Uses mechanics/thermo/materials to justify a real design decision, not to recite theory"
      - id: "ME-02"
        competency: "CAD/CAE tool depth"
        observable_evidence: "Production-level modelling; assembly management; drawing standards"
      - id: "ME-03"
        competency: "Design for manufacturability"
        observable_evidence: "Designs to real process capability and cost; has changed a design because of manufacturing feedback"
      - id: "ME-04"
        competency: "GD&T and tolerancing"
        observable_evidence: "Applies and defends tolerance decisions; understands stack-up"
      - id: "ME-05"
        competency: "Simulation & analysis"
        observable_evidence: "FEA/CFD with validated assumptions; knows when results are untrustworthy"
      - id: "ME-06"
        competency: "Process & quality methods"
        observable_evidence: "FMEA, root-cause, SPC, lean, Six Sigma applied to a real problem"
      - id: "ME-07"
        competency: "Hands-on/shop-floor exposure"
        observable_evidence: "Has worked with machines, operators and physical prototypes"
      - id: "ME-08"
        competency: "Testing & validation"
        observable_evidence: "Designs and runs tests; interprets failure"
      - id: "ME-09"
        competency: "Standards & compliance"
        observable_evidence: "Applies relevant codes and standards to the work"
      - id: "ME-10"
        competency: "Project execution"
        observable_evidence: "Delivered a component/product/line change on schedule with defined trade-offs"
      - id: "ME-11"
        competency: "Vendor & supply-chain interface"
        observable_evidence: "Has specified, sourced and qualified parts"
    seniority_notes: null
    subsections_present: 10
    validation_probes_source: "RPN-PHIL-001 §23.6"
    validation_probes:
      - "\"What tolerance did you specify and why that value?\""
      - "\"What did the shop floor tell you to change?\""
      - "\"What was the cost driver in that assembly?\""
      - "\"Which of your FEA assumptions were you least comfortable with?\""
      - "\"Describe a root-cause investigation you ran end to end.\""
      - "\"What machines have you personally stood next to while they ran?\""
    gaming_vectors_source: "RPN-PHIL-001 §23.8"
    gaming_vectors:
      - vector: "Coursework projects presented as industrial experience (probe for manufacturing feedback and cost - coursework has neither)"
      - vector: "tool lists without depth (require a live task)"
      - vector: "borrowed team-project drawings (ask about a specific dimension)"
      - vector: "certification claims (verify with issuer)"
      - vector: "inflated plant/line scale (probe throughput, shift structure, headcount)"
    red_flags_source: "RPN-PHIL-001 §23.9"
    red_flags:
      - "Cannot justify a single tolerance"
      - "no failure story at all after five years"
      - "describes designs with no cost or manufacturability dimension"
      - "claims FEA competence but cannot state boundary conditions or mesh sensitivity concerns"
      - "\"hands-on\" claimed with no specific equipment named"
  electrical_electronics_engineering:
    source: "RPN-PHIL-001 §24"
    number: 24
