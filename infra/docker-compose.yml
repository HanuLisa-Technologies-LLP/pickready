# Local dev stack (ESD §15): postgres+pgvector, redis, backend API, celery
# worker, celery beat, frontend dev server. Run from repo root:
#   docker compose -f infra/docker-compose.yml up --build
name: pickready

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pickready
      POSTGRES_PASSWORD: pickready
      POSTGRES_DB: pickready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickready -d pickready"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # host 6380 — 6379 is commonly taken; in-network stays redis:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    # env_file delivers the ENTIRE ../.env into the container, so all secrets —
    # FIREBASE_SERVICE_ACCOUNT_JSON, SMTP_HOST / SMTP_PORT / SMTP_USER /
    # SMTP_PASSWORD / SMTP_FROM_EMAIL / SMTP_FROM_NAME / SMTP_STARTTLS / SMTP_SSL
    # (Gmail SMTP email), CLOUDINARY_URL,
    # MSG91_API_KEY / MSG91_SENDER_ID, JWT_*, LLM keys — reach the API. The
    # `environment` block below only overrides the two hostnames that differ
    # inside the compose network; do NOT add SMTP_*/secret overrides here — an
    # explicit key with an empty value would MASK the real one from ../.env.
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pickready:pickready@postgres:5432/pickready
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      # Where the proctoring pipeline posts audio chunks. Empty in .env means
      # audio analysis is UNAVAILABLE, which the report states plainly; inside
      # the compose network the service is reachable by its own name.
      PROCTORING_ANALYSIS_SERVICE_URL: http://analysis:8100
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    # Goes through the SAME entrypoint as production (backend/Dockerfile), so
    # the `api` role is exercised locally rather than only in the cloud. The
    # trailing flags are appended to uvicorn by the entrypoint.
    #
    # --reload-dir limits the watcher to the Python package. Left unbounded it
    # walks the whole bind mount (alembic, tests, .pytest_cache, __pycache__)
    # on a Windows filesystem that gives no inotify events, so watchfiles polls
    # every file on an interval and burns CPU the API needs for requests.
    command: >
      api --reload --reload-dir /app/app --reload-include "*.py"

  worker:
    build: ../backend
    # Same as backend: env_file carries all secrets into the worker. The worker
    # is what actually SENDS mail/SMS and uploads to Cloudinary, so it must have
    # the SMTP_* email credentials, CLOUDINARY_URL, MSG91_* and the LLM keys —
    # all provided via ../.env below. Same caution: no SMTP_* override here.
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pickready:pickready@postgres:5432/pickready
      REDIS_URL: redis://redis:6379/0
      # The worker runs the reconciliation sweeps that re-read a session, so it
      # needs the same address the API posts chunks to.
      PROCTORING_ANALYSIS_SERVICE_URL: http://analysis:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    # Unprivileged: Celery's SecurityWarning about running as uid 0 is a real
    # warning, not noise. The account is created in ../backend/Dockerfile and is
    # now also the image's default USER, so this line is belt and braces.
    user: "10001:10001"
    command: worker

  beat:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pickready:pickready@postgres:5432/pickready
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    user: "10001:10001"
    # Beat writes its schedule file; /tmp is writable by the unprivileged user
    # while the bind-mounted source tree is not (and should not be). The path
    # is the entrypoint's default (CELERY_BEAT_SCHEDULE).
    command: beat

  # The proctoring analysis service (../analysis-service): speaker counting on
  # a fifteen-second audio chunk, and an AI-text estimate that ships disabled.
  #
  # ITS OWN IMAGE, not a role of the backend one, because it carries torch,
  # pyannote.audio and transformers -- several hundred megabytes the API and
  # the worker never load -- and because the one media type that leaves a
  # candidate's browser is handled here and nowhere else. It writes no audio
  # anywhere: the chunk is decoded from an in-memory buffer and destroyed.
  #
  # NO BIND MOUNT and no reload. The image bakes its model weights at build
  # time, so a mounted source tree would run new code against a cache the
  # container cannot see, and an editable model service is not a thing anybody
  # wants to debug.
  analysis:
    build:
      context: ../analysis-service
      args:
        # A local build has no Hugging Face token, so the gated diarization
        # models are skipped and /health reports diarization unavailable. To
        # bake them in, accept the two model licences (see
        # ../analysis-service/README.md), export HUGGINGFACE_TOKEN and run
        #   DOCKER_BUILDKIT=1 docker compose -f infra/docker-compose.yml build analysis
        # with `--build-arg ALLOW_MISSING_HUGGINGFACE_TOKEN=false`. CI never
        # passes true, so a deployed image is never missing them silently.
        ALLOW_MISSING_HUGGINGFACE_TOKEN: "true"
    # env_file carries HUGGINGFACE_TOKEN from ../.env. It is a RUNTIME
    # requirement as well as a build one: the model licence is accepted per
    # account, so the service refuses to load the gated pipeline without a
    # token even though its weights are already on disk.
    env_file: ../.env
    ports:
      - "8100:8100"
    healthcheck:
      # /health answers 200 while the process serves and reports each component
      # in the body, so a container with no token is up and honest rather than
      # restarting forever over a configuration decision.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      target: deps
    working_dir: /app
    # No env_file here on purpose. The Razorpay Key ID that Checkout needs in
    # the browser is served by GET /billing/config instead of being inlined at
    # build time, so the frontend container never holds the .env at all and
    # RAZORPAY_KEY_SECRET has no path into the bundle.
    environment:
      # Same-origin API proxy, identical to production. The browser calls
      # /api/* on the Next server and next.config.js forwards it here, which is
      # what keeps the auth cookies same-site (see lib/api.ts). Deliberately NOT
      # a NEXT_PUBLIC_ variable: it is read at server start and never enters the
      # bundle, so the built image is not pinned to one backend address.
      #
      # `backend` is the compose service name; in the cloud this is the backend
      # deployed URL. NEXT_PUBLIC_API_URL is intentionally unset so dev and
      # production exercise the same code path.
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      # `.next-dev` (next.config.js distDir in development) is a NAMED VOLUME,
      # deliberately not part of the ../frontend bind mount. Next's dev server
      # writes chunks here constantly; over a Windows bind mount through WSL2
      # those writes can land partially or out of order, and the dev server then
      # serves HTML referencing chunk URLs whose files are missing — the
      # "GET /_next/static/chunks/main-app.js 404" storm that made the app look
      # broken until both containers were restarted.
      - frontend_next_dev:/app/.next-dev
    # Wipe the previous run's build output before starting. Next mints a new
    # build id per dev server start; leftovers from the old id are dead weight
    # that only serve to confuse a browser holding a cached document.
    command: >
      sh -c "npm install --no-audit --no-fund
      && rm -rf /app/.next-dev/*
      && npm run dev"

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next_dev:
