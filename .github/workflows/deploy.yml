# PickReady, Cloud Run deployment.
#
# Two jobs, and the split is the whole point:
#
#   deploy-staged   builds, migrates, and creates revisions that serve NOBODY.
#                   Smoke tests run against the staged revision's tag URL. A
#                   failure here costs a build, not an outage.
#   promote-to-prod shifts live traffic. Gated on the "production" GitHub
#                   Environment, so it does not start until a human approves.
#
# Authentication is Workload Identity Federation: no service-account key is
# stored in this repository. See scripts/setup-wif-once.sh.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual reruns for a rollback or a re-promote, without an empty commit.
  workflow_dispatch:

# Never let two deploys interleave. Without this, two pushes in quick
# succession race through migrations and can promote the older revision second.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: pick-ready-503913
  GCP_REGION: asia-south1
  GCP_ARTIFACT_REPO: pickready
  SVC_BACKEND: pickready-backend
  SVC_FRONTEND: pickready-frontend
  WL_WORKER: pickready-worker
  WL_BEAT: pickready-beat
  JOB_MIGRATE: pickready-migrate
  SQL_INSTANCE: pickready-postgres
  REDIS_INSTANCE: pickready-redis
  RUNTIME_SA: pickready-runtime@pick-ready-503913.iam.gserviceaccount.com

jobs:
  # ---------------------------------------------------------------------------
  # THE TEST GATE. Added 2026-08-06, and it was missing until then.
  #
  # This pipeline built, migrated, staged and smoke-tested, and never once ran
  # the unit suite or the agent evaluation. claude.md asserted that "CI gates on
  # `app/scripts/eval_interview.py`"; it did not. Nothing stopped a commit whose
  # tests failed from reaching a production revision -- the smoke test only asks
  # whether the service answers HTTP, which is exactly the gap that produced the
  # 2026-08-04 "every deploy green, three features broken" release.
  #
  # It runs BEFORE the build, and `deploy-staged` needs it, so a red suite costs
  # a two-minute job rather than a build, a migration and a staged revision.
  test:
    name: Backend tests and agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # pgvector, not plain postgres: the schema declares vector columns and
      # `alembic upgrade` fails on `CREATE EXTENSION vector` without it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pickready
          POSTGRES_PASSWORD: pickready
          POSTGRES_DB: pickready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pickready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://pickready:pickready@localhost:5432/pickready
      # A throwaway signing key. The suite mints and verifies its own tokens and
      # never talks to a real identity provider.
      JWT_SECRET: ci-test-secret-not-used-anywhere-else
      ENVIRONMENT: development
      # Deliberately EMPTY. With no provider keys the router raises on every
      # call and each agent takes its documented degraded path, so the suite
      # exercises the fallbacks rather than quietly depending on a live model --
      # and a CI run cannot be reddened by somebody else's rate limit.
      GROQ_API_KEY_1: ""
      GEMINI_API_KEY_1: ""
      OPENROUTER_API_KEY_1: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Apply migrations
        working-directory: backend
        # The suite's database-backed tests skip when Postgres is unreachable,
        # which would let a schema error pass as a green run. Migrating first
        # means a broken migration fails HERE, loudly, instead of failing in the
        # Cloud Run migrate job after the images are already built.
        run: alembic upgrade head

      - name: Unit and integration tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Agent evaluation
        working-directory: backend
        # Fully stubbed and offline on purpose: a rate that moves means the CODE
        # changed, not that a provider sampled differently. It measures
        # judgement across a labelled set and exits non-zero when any rate falls
        # below its threshold.
        run: python -m app.scripts.eval_interview

      - name: Report and matching evaluation
        working-directory: backend
        # The second eval, added 2026-08-11. `eval_interview` measures the
        # agent that TALKS to a candidate; this one measures what gets
        # PERSISTED: grade boundaries, remark word bands in every branch
        # including the outage fallbacks, no number reaching a client, no
        # third-party instrument named, culture refused, counts by grade.
        # Offline and deterministic for the same reason as the first.
        run: python -m app.scripts.eval_report

  frontend-test:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.pickready.test
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-pickready
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-pickready
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Component and utility tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Design token contrast
        working-directory: frontend
        # The purple field affordance is only worth having if it is actually
        # visible. This computes the WCAG ratios from the HSL triples in
        # globals.css and fails below 3:1 for a control boundary. The first
        # value written by hand was 2.66:1, so this is not theoretical.
        run: npm run contrast

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Visual QA (production build)
        working-directory: frontend
        # Playwright, against the BUILT app rather than the dev server: no
        # horizontal overflow at three viewports, no console errors, computed
        # field contrast on the rendered page, and scroll-triggered motion in
        # both the default and reduced-motion modes.
        run: |
          npx playwright install --with-deps chromium
          npx next start -p 3100 &
          npx wait-on -t 60000 http://127.0.0.1:3100/
          npm run qa:visual -- http://127.0.0.1:3100

  # ---------------------------------------------------------------------------
  deploy-staged:
    name: Build, migrate and stage
    needs: [test, frontend-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      # id-token: write is what mints the OIDC assertion WIF exchanges for a
      # Google access token. Without it the auth step fails with a bare
      # "unable to get ACTIONS_ID_TOKEN_REQUEST_URL", which reads as a
      # misconfigured provider rather than a missing permission.
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.deploy.outputs.IMAGE_TAG }}
      stage_tag: ${{ steps.deploy.outputs.STAGE_TAG }}
      backend_url: ${{ steps.deploy.outputs.BACKEND_URL }}
      frontend_url: ${{ steps.deploy.outputs.FRONTEND_URL }}
      backend_staged_url: ${{ steps.deploy.outputs.BACKEND_STAGED_URL }}
      frontend_staged_url: ${{ steps.deploy.outputs.FRONTEND_STAGED_URL }}
      backend_revision: ${{ steps.deploy.outputs.BACKEND_REVISION }}
      frontend_revision: ${{ steps.deploy.outputs.FRONTEND_REVISION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Make scripts executable
        # The repo is developed on Windows, where the executable bit is not
        # tracked. Setting it here means a fresh clone deploys without a
        # "Permission denied" that looks like a missing file.
        run: chmod +x scripts/*.sh

      - name: Deploy (staged, no traffic)
        id: deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
          TRAFFIC_MODE: no-traffic
          # Firebase web config is inlined into the frontend bundle at BUILD
          # time, so it cannot be a deploy-time env var. deploy.sh falls back to
          # Secret Manager when these are absent; set them as repository secrets
          # only if you would rather not keep them in Secret Manager.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: ./scripts/deploy.sh

      # Minted here rather than read from a stored secret. A PickReady access
      # token lives 15 minutes and this job spends about 10 of them building
      # images, so a hand-pasted TEST_BEARER_TOKEN is usually dead before the
      # smoke step runs -- observed as "Signature has expired" (run #9) and,
      # after a manual refresh, "Invalid crypto padding" (run #10).
      - name: Mint a smoke-test token
        id: smoke_token
        run: |
          JWT_SECRET="$(gcloud secrets versions access latest \
            --secret=JWT_SECRET --project="$GCP_PROJECT_ID")"
          TOKEN="$(JWT_SECRET="$JWT_SECRET" python3 scripts/mint-smoke-token.py)"
          # Mask before emitting: ::add-mask:: redacts the value from every
          # subsequent log line, and a token that reached the log unmasked
          # would stay readable in the run's artifacts for its whole lifetime.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Smoke test the staged revision
        env:
          BACKEND_STAGED_URL: ${{ steps.deploy.outputs.BACKEND_STAGED_URL }}
          FRONTEND_STAGED_URL: ${{ steps.deploy.outputs.FRONTEND_STAGED_URL }}
          TEST_BEARER_TOKEN: ${{ steps.smoke_token.outputs.token }}
        run: ./scripts/smoke-test.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### PickReady staged deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| backend revision | \`${{ steps.deploy.outputs.BACKEND_REVISION }}\` |"
            echo "| frontend revision | \`${{ steps.deploy.outputs.FRONTEND_REVISION }}\` |"
            echo "| backend staged | ${{ steps.deploy.outputs.BACKEND_STAGED_URL }} |"
            echo "| frontend staged | ${{ steps.deploy.outputs.FRONTEND_STAGED_URL }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  promote-to-prod:
    name: Promote to production
    needs: deploy-staged
    # needs already implies success, but saying so keeps the gate obvious to
    # anyone editing this file later.
    if: github.event_name != 'pull_request' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # THE APPROVAL GATE. This job does not start until a required reviewer on
    # the "production" environment approves it. The gate is a property of the
    # environment, configured in the repository settings, NOT of this file: a
    # "production" environment with no required reviewer promotes instantly and
    # silently. See SETUP_INSTRUCTIONS.md step 5.
    environment:
      name: production
      url: ${{ needs.deploy-staged.outputs.frontend_url }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Shift 100% traffic to the approved revisions
        env:
          # Named revisions, not "latest": the reviewer approved the revisions
          # that were smoke-tested, and a deploy landing in between must not be
          # able to ride in on that approval.
          BACKEND_REVISION: ${{ needs.deploy-staged.outputs.backend_revision }}
          FRONTEND_REVISION: ${{ needs.deploy-staged.outputs.frontend_revision }}
          STAGE_TAG: ${{ needs.deploy-staged.outputs.stage_tag }}
        run: ./scripts/promote.sh

      # A SECOND mint, deliberately not reused from deploy-staged. This job sits
      # behind the production environment's approval gate, which can hold for
      # hours; any token handed across from the earlier job would be long
      # expired by the time a reviewer clicks approve.
      - name: Mint a smoke-test token
        id: smoke_token
        run: |
          JWT_SECRET="$(gcloud secrets versions access latest \
            --secret=JWT_SECRET --project="$GCP_PROJECT_ID")"
          TOKEN="$(JWT_SECRET="$JWT_SECRET" python3 scripts/mint-smoke-token.py)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        # The same probes, now against the live URLs. A pass here is the proof
        # that the promotion itself worked, not just the staged revision.
        env:
          BACKEND_STAGED_URL: ${{ needs.deploy-staged.outputs.backend_url }}
          FRONTEND_STAGED_URL: ${{ needs.deploy-staged.outputs.frontend_url }}
          TEST_BEARER_TOKEN: ${{ steps.smoke_token.outputs.token }}
        run: ./scripts/smoke-test.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### PickReady promoted to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| backend | ${{ needs.deploy-staged.outputs.backend_url }} |"
            echo "| frontend | ${{ needs.deploy-staged.outputs.frontend_url }} |"
            echo
            echo "Rollback: \`./scripts/promote.sh rollback <previous-revision> pickready-backend\`"
          } >> "$GITHUB_STEP_SUMMARY"
